[project]
name = "hubbleops"
version = "0.1.0"
description = "Truth Engine and independent Verification Authority for third-party API migrations."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "referencing>=0.35.0",
]

[project.scripts]
hops = "hubbleops.app.cli:main"
hubbleops = "hubbleops.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.0",
    "pyright>=1.1.403",
    "hatchling>=1.27.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hubbleops"]
exclude = ["hubbleops/_toolchain"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
link-mode = "copy"

[tool.uv.workspace]
members = ["packages/hubbleops-sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "tests/fixtures", "tests/adversarial/*/files"]

[tool.pyright]
include = ["hubbleops", "tests", ".claude", "packages/hubbleops-sentinel/src", "packages/hubbleops-sentinel/tests"]
exclude = ["**/__pycache__", "**/.venv", "tests/fixtures", "tests/adversarial/*/files", "hubbleops/sandbox/proxy_addon.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
extraPaths = ["packages/hubbleops-sentinel/src"]
