[project]
name = "hubbleops"
version = "0.1.0"
description = "Truth Engine and independent Verification Authority for third-party API migrations."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "referencing>=0.35.0",
]

[project.scripts]
hops = "hubbleops.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hubbleops"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.pyright]
include = ["hubbleops"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
