name: google_ads

identifiers:
  - google-ads
  - googleads
  - google_ads
  - google.ads.googleads
  - GoogleAdsClient
  - GoogleAdsService
  - GoogleAdsFieldService
  - GoogleAdsFailure
  - GoogleAdsException
  - SearchGoogleAdsRequest
  - SearchGoogleAdsStreamRequest
  - MutateGoogleAdsRequest
  - google-ads.yaml
  - developer_token
  - login_customer_id
  - GOOGLE_ADS_DEVELOPER_TOKEN
  - GOOGLE_ADS_LOGIN_CUSTOMER_ID
  - GOOGLE_ADS_CUSTOMER_ID
  - GOOGLE_ADS_CLIENT_ID
  - GOOGLE_ADS_CLIENT_SECRET
  - GOOGLE_ADS_REFRESH_TOKEN
  - GOOGLE_ADS_CONFIGURATION_FILE_PATH
  - GOOGLE_ADS_JSON_KEY_FILE_PATH

hosts:
  - googleads.googleapis.com

package_names:
  - google-ads
  - googleads/google-ads-php
  - google-ads-api
  - google-ads-node
  - Google.Ads.GoogleAds
  - com.google.api-ads:google-ads
  - com.google.api-ads:google-ads-stubs-v22
  - google-ads-googleads
  - google.golang.org/genproto/googleapis/ads/googleads

version_carriers:
  - name: rest_endpoint_version
    regex: 'googleads\.googleapis\.com/(?P<version>v[0-9]+)'
    slot: per_call
    languages: [any]
    scope: wire
  - name: rest_path_version
    regex: '/(?P<version>v[0-9]+)/customers/'
    slot: per_call
    languages: [any]
    scope: wire
  - name: proto_namespace_version
    regex: 'google\.ads\.googleads\.(?P<version>v[0-9]+)'
    slot: sdk_default
    languages: [any]
    scope: wire
  - name: python_namespace_version
    regex: 'google\.ads\.googleads\.(?P<version>v[0-9]+)'
    slot: sdk_default
    languages: [python]
    scope: sdk
  - name: grpc_method_version
    regex: '/google\.ads\.googleads\.(?P<version>v[0-9]+)\.services\.'
    slot: per_call
    languages: [any]
    scope: wire
  - name: python_service_version
    regex: 'get_service\([^)]*version\s*=\s*["''](?P<version>v[0-9]+)["'']'
    slot: per_call
    languages: [python]
  - name: python_type_version
    regex: 'get_type\([^)]*version\s*=\s*["''](?P<version>v[0-9]+)["'']'
    slot: per_call
    languages: [python]
  - name: python_client_version
    regex: 'GoogleAdsClient[^)]*version\s*=\s*["''](?P<version>v[0-9]+)["'']'
    slot: client_init
    languages: [python]
  - name: php_namespace_version
    regex: 'Google\\Ads\\GoogleAds\\(?P<version>V[0-9]+)'
    slot: sdk_default
    languages: [php]
  - name: dotnet_namespace_version
    regex: 'Google\.Ads\.GoogleAds\.(?P<version>V[0-9]+)'
    slot: sdk_default
    languages: [csharp]
  - name: java_namespace_version
    regex: 'com\.google\.ads\.googleads\.(?P<version>v[0-9]+)'
    slot: sdk_default
    languages: [java]
  - name: go_namespace_version
    regex: 'googleapis/ads/googleads/(?P<version>v[0-9]+)'
    slot: sdk_default
    languages: [go]
  - name: node_api_version
    regex: 'apiVersion\s*:\s*["''](?P<version>v[0-9]+)["'']'
    slot: client_init
    languages: [javascript, typescript, tsx]
  - name: config_literal_version
    regex: '(?:GOOGLE_ADS_API_VERSION|GOOGLE_ADS_VERSION|ADS_API_VERSION)\s*[=:]\s*["'']?(?P<version>v[0-9]+)'
    slot: sdk_default
    languages: [any]
    scope: sdk

request_languages:
  - name: gaql
    shapes:
      - '(?is)\bSELECT\b.*?\bFROM\s+(?P<resource>[a-z][a-z0-9_]*)'
      - '(?is)\bSELECT\s+(?P<resource>[a-z][a-z0-9_]*)\.[a-z0-9_]+'
      - '(?is)\bFROM\s+(?P<resource>[a-z][a-z0-9_]*)\s*(?:$|\bWHERE\b|\bLIMIT\b|\bORDER\b|\bPARAMETERS\b|["\x27`])'
    resource_group: resource
    anchors:
      - 'metrics\.(impressions|clicks|cost_micros|conversions)'
      - 'segments\.(date|device|conversion_action)'

sink_argument_positions:
  - sink: get_service
    argument: version
    position: 1
  - sink: get_type
    argument: version
    position: 1
  - sink: GoogleAdsClient.load_from_storage
    argument: version
    position: 1
  - sink: search
    argument: request
    position: 0
  - sink: search_stream
    argument: request
    position: 0
  - sink: mutate
    argument: request
    position: 0

config_env_keys:
  - GOOGLE_ADS_API_VERSION
  - GOOGLE_ADS_VERSION
  - ADS_API_VERSION

adjacent_contracts:
  - name: data_manager
    hosts:
      - datamanager.googleapis.com
    reason: >-
      the Data Manager API carries its own version lattice and its own event schema; Google Ads
      conversion upload migrated onto it, so it sits beside Google Ads code and must be separated
      from the Google Ads contract rather than migrated with it
  - name: google_oauth
    hosts:
      - oauth2.googleapis.com
      - accounts.google.com
    reason: >-
      Google account OAuth is shared Google infrastructure with no Google Ads version in its
      request target; it authorises Google Ads calls without being one
  - name: merchant_api
    hosts:
      - merchantapi.googleapis.com
      - shoppingcontent.googleapis.com
    reason: >-
      the Merchant API and the Content API for Shopping carry their own version lattices and
      their own product and account schemas; Merchant Center code sits beside Google Ads code
      and must be separated from the Google Ads contract rather than migrated with it

contract_surfaces:
  - kind: auth_scope
    name: ads_oauth_scope
    shape: 'https://www\.googleapis\.com/auth/(adwords|datamanager)'
    gated: false
  - kind: protocol_header
    name: ads_request_header
    shape: '["\x27](developer-token|login-customer-id|linked-customer-id)["\x27]'
  - kind: resource_name
    name: ads_resource_name
    shape: 'customers/[^"\x27`\s]*/(conversionActions|customerClients|conversionUploads|adGroups|campaigns)'
    gated: false
  - kind: endpoint_path
    name: ads_rest_method
    shape: '(customers|googleAds|conversionActions)[:/][A-Za-z]+(:[a-zA-Z]+)?'
  - kind: response_field
    name: ads_failure_detail
    shape: '(GoogleAdsFailure|partialFailureError|google\.ads\.googleads\.v[0-9]+\.errors|errors(?:\?\.)?\[[0-9]*\](?:\?\.|->|\.)errorCode(?:(?:\?\.|->|\.)(?:authorizationError|requestError|queryError|mutateError|fieldError|authenticationError))?|(?:errorCode|error_code)(?:\?\.|->|\.)(?:authorizationError|requestError|queryError|mutateError|fieldError|authenticationError))'
