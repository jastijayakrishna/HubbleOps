[project]
name = "hubbleops-sentinel"
version = "0.1.0"
description = "Independent observational API sensor; proxy mode is the recommended default."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hubbleops-sentinel = "hubbleops_sentinel.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubbleops_sentinel"]
artifacts = ["src/hubbleops_sentinel/data/*.json"]
